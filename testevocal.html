<body>

  <header class="cabecalho">
    <a href="index.php" class="btn-voltar-index">← Voltar ao Início</a>
    <div class="texto-cabecalho">
      <div class="topo">Teste vocacional</div>
      <div class="meio">
        Qual carreira <br>
        <span class="destaque">Dá match comigo?</span>
      </div>
      <div class="baixo">
        Explore suas habilidades nesse teste vocacional gratuito <br>
        que te ajuda a descobrir o seu perfil profissional
      </div>
    </div>
  </header>

  <div class="conteudo">
    <div class="progresso-container">
      <progress id="progresso" value="0" max="20"></progress>
      <span id="percentual">0%</span>
    </div>

    <div class="pergunta" id="pergunta"></div>
    <div class="opcoes" id="opcoes"></div>


<!-- Botão "Voltar" -->
<div class="btns-navegacao">
  <button id="btn-voltar" class="btn" onclick="voltarPergunta()" style="display:none;">Voltar</button>
  <button class="btn" onclick="proximaPergunta()">Próxima</button>
</div>


    <div class="resultado" id="resultado"></div>
  </div>

  <script>
    const perguntas = [
      "Gosto de resolver problemas lógicos e matemáticos.",
      "Tenho interesse em entender como funcionam os computadores.",
      "Me sinto confortável em ajudar pessoas emocionalmente.",
      "Tenho facilidade em aprender idiomas.",
      "Me interesso por como o corpo humano funciona.",
      "Gosto de criar coisas novas e inovadoras.",
      "Me vejo trabalhando em equipe para alcançar objetivos.",
      "Tenho curiosidade sobre leis e justiça.",
      "Gosto de desenhar, pintar ou criar arte.",
      "Me interesso por negócios e empreendedorismo.",
      "Gosto de trabalhar com números e estatísticas.",
      "Tenho interesse em cuidar de animais.",
      "Me sinto motivado por desafios científicos.",
      "Gosto de ensinar e compartilhar conhecimento.",
      "Me interesso por moda, design ou estética.",
      "Tenho facilidade em lidar com tecnologia.",
      "Me vejo trabalhando em ambientes organizados e estruturados.",
      "Gosto de escrever e comunicar ideias.",
      "Tenho interesse em proteger o meio ambiente.",
      "Me vejo liderando projetos ou pessoas."
    ];

    const respostas = [];
    let indice = 0;

    const cores = ["verde", "verde-claro", "amarelo", "laranja", "vermelho"];
    const valores = [5, 4, 3, 2, 1];
    const descricoes = [
      "Concordo plenamente",
      "Concordo",
      "Neutro",
      "Discordo",
      "Discordo plenamente"
    ];

    function atualizarProgresso() {
      const progresso = document.getElementById("progresso");
      const percentual = document.getElementById("percentual");

      progresso.value = indice + 1;
      const porcentagem = Math.round(((indice + 1) / perguntas.length) * 100);
      percentual.textContent = porcentagem + "%";
    }

  function mostrarPergunta() {
  document.getElementById("pergunta").innerText = perguntas[indice];
  const opcoes = document.getElementById("opcoes");
  opcoes.innerHTML = "";
  
  cores.forEach((cor, i) => {
    const opcao = document.createElement("div");
    opcao.className = "opcao";
    const bolinha = document.createElement("div");
    bolinha.className = `bolinha ${cor}`;
    bolinha.onclick = () => {
      respostas[indice] = valores[i];
      document.querySelectorAll(".bolinha").forEach(b => b.style.border = "2px solid white");
      bolinha.style.border = "4px solid #fff";
    };
    const desc = document.createElement("div");
    desc.className = "descricao-opcao";
    desc.innerText = descricoes[i];
    opcao.appendChild(bolinha);
    opcao.appendChild(desc);
    opcoes.appendChild(opcao);
  });

  // Mostra ou esconde o botão "Voltar"
  document.getElementById("btn-voltar").style.display = (indice > 0) ? "inline-block" : "none";

  atualizarProgresso();
}


    function proximaPergunta() {
      if (respostas[indice] === undefined) {
        alert("Por favor, selecione uma resposta.");
        return;
      }
      indice++;
      if (indice < perguntas.length) {
        mostrarPergunta();
      } else {
        mostrarResultado();
      }
    }

    function voltarPergunta() {
      if (indice > 0) {
        indice--;
        mostrarPergunta();
      }
    }

    function mostrarResultado() {
      document.getElementById("pergunta").style.display = "none";
      document.getElementById("opcoes").style.display = "none";
      document.querySelector(".btns-navegacao").style.display = "none";

      let pontuacoes = {
        "Tecnologia": respostas[0] + respostas[1] + respostas[15],
        "Saúde": respostas[4] + respostas[2] + respostas[11],
        "Humanas": respostas[3] + respostas[7] + respostas[13] + respostas[17],
        "Exatas": respostas[0] + respostas[10] + respostas[12],
        "Artes": respostas[8] + respostas[14],
        "Negócios": respostas[9] + respostas[6] + respostas[19],
        "Meio Ambiente": respostas[18]
      };

      let resultadoTexto = "<h2>Áreas que combinam com você:</h2><ul>";
      for (let area in pontuacoes) {
        if (pontuacoes[area] >= 12) {
          resultadoTexto += `<li><strong>${area}</strong></li>`;
        }
      }
      resultadoTexto += "</ul>";

      const resultado = document.getElementById("resultado");
      resultado.innerHTML = resultadoTexto;
      resultado.style.display = "block";
    }

    mostrarPergunta();
  </script>
